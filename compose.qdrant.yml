# -*- coding: utf-8 -*-
services:
  qdrant:
    image: qdrant/qdrant:v1.16.2
    container_name: ecommerce-assistant-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qdrant-data:
